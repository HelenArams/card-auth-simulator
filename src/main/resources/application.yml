spring:
  application:
    name: card-auth-simulator
  datasource:
    url: jdbc:h2:mem:cardauth;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

cardauth:
  rules:
    # merchant category codes the issuer refuses outright (gambling, quasi-cash)
    blocked-mccs: [7995, 6051]
    # per-transaction cap and daily approval count; amounts are in minor units
    per-transaction-limit: 75000
    max-daily-count: 10
